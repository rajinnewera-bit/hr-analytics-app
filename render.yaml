services:
  - type: web
    name: ai-finance-analyst-backend
    runtime: python
    rootDir: backend
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: ./start.sh
    envVars:
      - key: APP_ENV
        value: production
      - key: CORS_ALLOW_ORIGINS
        sync: false
      - key: UPLOADS_DIR
        value: /tmp/ai-finance-uploads
      - key: PYTHON_VERSION
        value: 3.11.11
